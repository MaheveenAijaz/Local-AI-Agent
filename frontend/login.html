<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Local AI Agent</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
.container { width:100%; max-width:440px; animation:fadeIn 0.5s ease; position:relative; z-index:2; }
@keyframes fadeIn { from{opacity:0;transform:translateY(-20px);} to{opacity:1;transform:translateY(0);} }
.logo { text-align:center; margin-bottom:30px; color:white; }
.logo-icon { font-size:60px; margin-bottom:15px; animation:float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
.logo h1 { font-size:32px; font-weight:700; margin-bottom:10px; }
.logo p { font-size:16px; opacity:0.9; }
.card { background:white; border-radius:20px; padding:40px; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
.card h2 { font-size:24px; color:#333; margin-bottom:8px; }
.card .subtitle { color:#666; margin-bottom:30px; font-size:15px; }
.form-group { margin-bottom:20px; }
.form-group label { display:block; margin-bottom:8px; font-weight:500; color:#333; font-size:14px; }
.input-with-icon { position:relative; }
.input-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:#999; }
input[type="text"], input[type="password"] { width:100%; padding:14px 16px 14px 46px; border:2px solid #e1e5e9; border-radius:12px; font-size:15px; transition: all 0.2s; background:#f8f9fa; }
input:focus { outline:none; border-color:#667eea; background:white; box-shadow:0 0 0 3px rgba(102,126,234,0.1); }
.form-options { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; font-size:14px; }
.remember { display:flex; align-items:center; gap:8px; color:#666; }
.remember input { width:16px; height:16px; }
.forgot-password { color:#667eea; text-decoration:none; font-weight:500; cursor:pointer; }
.btn { width:100%; padding:16px; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition: all 0.2s; }
.btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(102,126,234,0.3); }
.btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
.signup-link { text-align:center; margin-top:25px; color:#666; font-size:14px; }
.signup-link a { color:#667eea; text-decoration:none; font-weight:600; margin-left:5px; }
.signup-link a:hover { text-decoration:underline; }
.notification { position:fixed; top:20px; right:20px; padding:15px 20px; border-radius:12px; background:white; box-shadow:0 10px 30px rgba(0,0,0,0.15); display:flex; align-items:center; gap:12px; z-index:1000; max-width:350px; animation:slideIn 0.3s ease; }
@keyframes slideIn { from{transform:translateX(100px);opacity:0;} to{transform:translateX(0);opacity:1;} }
@keyframes slideOut { from{transform:translateX(0);opacity:1;} to{transform:translateX(100px);opacity:0;} }
.notification.hidden { animation:slideOut 0.3s ease forwards; }
.notification-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.notification.success { border-left:4px solid #10b981; }
.notification.success .notification-icon { background:#10b981; color:white; }
.notification.error { border-left:4px solid #ef4444; }
.notification.error .notification-icon { background:#ef4444; color:white; }
.notification.info { border-left:4px solid #3b82f6; }
.notification.info .notification-icon { background:#3b82f6; color:white; }
.notification-content { flex:1; }
.notification-content strong { display:block; margin-bottom:4px; color:#333; }
.notification-content p { color:#666; font-size:14px; line-height:1.4; }
.close-notification { background:none; border:none; color:#999; cursor:pointer; padding:4px; font-size:18px; }
.close-notification:hover { color:#333; }
.spinner { display:inline-block; width:20px; height:20px; border:3px solid rgba(255,255,255,.3); border-radius:50%; border-top-color:white; animation:spin 1s ease-in-out infinite; }
@keyframes spin { to{transform:rotate(360deg);} }
</style>
</head>
<body>

<div id="notificationContainer"></div>

<div class="container">
    <div class="logo">
        <div class="logo-icon"><i class="fas fa-robot"></i></div>
        <h1>Local AI Agent</h1>
        <p>Your Private AI Assistant</p>
    </div>

    <div class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your AI workspace</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-with-icon">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
            </div>

            <div class="form-options">
                <div class="remember">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>
                <a class="forgot-password" id="forgotPasswordLink">Forgot password?</a>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create one here</a>
        </div>
    </div>
</div>

<script>
function showNotification(msg,type='info',duration=4000){
    const c=document.getElementById('notificationContainer');
    const id='n-'+Date.now();
    const icons={success:'✓',error:'✗',info:'🤖'};
    const n=document.createElement('div');
    n.id=id;n.className=`notification ${type}`;
    n.innerHTML=`<div class="notification-icon">${icons[type]||icons.info}</div>
    <div class="notification-content"><strong>${type.toUpperCase()}</strong><p>${msg}</p></div>
    <button class="close-notification" onclick="closeNotification('${id}')">×</button>`;
    c.appendChild(n);
    if(duration>0)setTimeout(()=>closeNotification(id),duration);
}
function closeNotification(id){const n=document.getElementById(id);if(n){n.classList.add('hidden');setTimeout(()=>n.remove(),300);}}

document.getElementById('loginForm').addEventListener('submit',async function(e){
    e.preventDefault();
    const username=document.getElementById('username').value.trim();
    const password=document.getElementById('password').value;
    const rememberMe=document.getElementById('rememberMe').checked;

    if(!username || !password){showNotification('Please fill in all fields','error'); return;}

    const loginBtn=document.getElementById('loginBtn');
    const originalText=loginBtn.innerHTML;
    loginBtn.innerHTML='<div class="spinner"></div> Signing in...';
    loginBtn.disabled=true;

    try{
        const response=await fetch('http://127.0.0.1:8080/api/login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username,password})
        });
        const data=await response.json();
        if(data.success){
            showNotification('Login successful! Redirecting...','success');
            if(rememberMe)localStorage.setItem('rememberedUser',username);
            else localStorage.removeItem('rememberedUser');
            localStorage.setItem('isLoggedIn','true');
            localStorage.setItem('username',username);
            localStorage.setItem('userId', data.user_id);
            setTimeout(()=>window.location.href='chat.html',1000);
        }else{
            showNotification(data.error || 'Invalid username or password','error');
            loginBtn.innerHTML=originalText;
            loginBtn.disabled=false;
        }
    }catch(err){
        console.error('Login error:',err);
        showNotification('Connection error. Make sure backend is running at http://127.0.0.1:8080','error');
        loginBtn.innerHTML=originalText;
        loginBtn.disabled=false;
    }
});

// Prefill remembered user
const rememberedUser=localStorage.getItem('rememberedUser');
if(rememberedUser){
    document.getElementById('username').value=rememberedUser;
    document.getElementById('rememberMe').checked=true;
}

// Forgot password handler
document.getElementById('forgotPasswordLink').addEventListener('click', function() {
    showNotification('Please contact admin to reset password', 'info');
});
</script>
</body>
</html>
