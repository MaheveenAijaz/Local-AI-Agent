<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Local AI Agent</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
:root { --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #10b981; --dark:#1f2937; --light:#f9fafb; --gray:#6b7280; --gray-light:#e5e7eb; }
body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding:1rem; }
.container { width:100%; max-width:440px; }
.logo { text-align:center; margin-bottom:2rem; color:white; }
.logo-icon { font-size:3rem; margin-bottom:1rem; animation:float 3s ease-in-out infinite; }
@keyframes float {0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
.logo h1 { font-size:2.2rem; margin-bottom:0.5rem; font-weight:700; }
.logo p { font-size:1rem; opacity:0.9; }
.card { background:white; border-radius:16px; padding:2.5rem; box-shadow:0 20px 40px rgba(0,0,0,0.1); animation:slideUp 0.6s ease-out; }
@keyframes slideUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
.card-header { text-align:center; margin-bottom:2rem; }
.card-header h2 { font-size:1.8rem; color:var(--dark); margin-bottom:0.5rem; }
.card-header p { color:var(--gray); font-size:0.95rem; }
.form-group { margin-bottom:1.5rem; }
.form-label { display:block; margin-bottom:0.5rem; color:var(--dark); font-weight:500; font-size:0.95rem; }
.input-with-icon { position:relative; }
.input-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--gray); }
.form-input { width:100%; padding:0.875rem 1rem 0.875rem 3rem; border:1px solid var(--gray-light); border-radius:10px; font-size:1rem; transition:all 0.2s; background-color:var(--light); }
.form-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.1); background-color:white; }
.password-toggle { position:absolute; right:1rem; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--gray); cursor:pointer; font-size:1rem; }
.password-strength { margin-top:0.5rem; font-size:0.85rem; color:var(--gray); }
.strength-bar { height:4px; background-color:var(--gray-light); border-radius:2px; margin-top:0.25rem; overflow:hidden; }
.strength-fill { height:100%; width:0%; transition: width 0.3s, background-color 0.3s; }
.terms { display:flex; align-items:flex-start; gap:0.75rem; margin-bottom:1.5rem; }
.terms-checkbox { margin-top:0.25rem; }
.terms label { font-size:0.9rem; color:var(--gray); line-height:1.4; }
.terms a { color:var(--primary); text-decoration:none; font-weight:500; }
.terms a:hover { text-decoration:underline; }
.btn { width:100%; padding:1rem; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:0.75rem; }
.btn:hover { transform:translateY(-2px); box-shadow:0 10px 20px rgba(99,102,241,0.3); }
.btn:disabled { background:var(--gray-light); color:var(--gray); cursor:not-allowed; transform:none; box-shadow:none; }
.login-link { text-align:center; margin-top:1.5rem; color:var(--gray); font-size:0.95rem; }
.login-link a { color:var(--primary); text-decoration:none; font-weight:600; margin-left:0.5rem; }
.login-link a:hover { text-decoration:underline; }
.notification { position:fixed; top:20px; right:20px; padding:15px 20px; border-radius:12px; background:white; box-shadow:0 10px 30px rgba(0,0,0,0.15); display:flex; align-items:center; gap:12px; z-index:1000; animation:slideIn 0.3s ease; max-width:350px; }
@keyframes slideIn { from{transform:translateX(100px);opacity:0;} to{transform:translateX(0);opacity:1;} }
@keyframes slideOut { from{transform:translateX(0);opacity:1;} to{transform:translateX(100px);opacity:0;} }
.notification.hidden { animation:slideOut 0.3s ease forwards; }
.notification-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.notification.success { border-left:4px solid #10b981; } .notification.success .notification-icon { background:#10b981; color:white; }
.notification.error { border-left:4px solid #ef4444; } .notification.error .notification-icon { background:#ef4444; color:white; }
.notification.info { border-left:4px solid #3b82f6; } .notification.info .notification-icon { background:#3b82f6; color:white; }
.notification-content { flex:1; } .notification-content strong { display:block; margin-bottom:4px; color:#333; } .notification-content p { color:#666; font-size:14px; line-height:1.4; }
.close-notification { background:none; border:none; color:#999; cursor:pointer; padding:4px; font-size:18px; }
.close-notification:hover { color:#333; }
.spinner { display:inline-block; width:20px; height:20px; border:3px solid rgba(255,255,255,.3); border-radius:50%; border-top-color:white; animation:spin 1s ease-in-out infinite; }
@keyframes spin { to{transform:rotate(360deg);} }
</style>
</head>
<body>
<div id="notificationContainer"></div>

<div class="container">
    <div class="logo">
        <div class="logo-icon"><i class="fas fa-robot"></i></div>
        <h1>Local AI Agent</h1>
        <p>Start your AI journey</p>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Create Account</h2>
            <p>Join our AI community</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-with-icon">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" class="form-input" id="username" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-input" id="password" placeholder="Create a strong password" required>
                    <button type="button" class="password-toggle" id="togglePassword"><i class="fas fa-eye"></i></button>
                </div>
                <div class="password-strength">
                    <span id="strengthText">Password strength: </span>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-input" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" class="terms-checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#" onclick="showTerms()">Terms of Service</a> and <a href="#" onclick="showPrivacy()">Privacy Policy</a></label>
            </div>

            <button type="submit" class="btn" id="submitBtn"><i class="fas fa-user-plus"></i> Create Account</button>

            <div class="login-link">
                Already have an account? <a href="login.html">Sign in here</a>
            </div>
        </form>
    </div>
</div>

<script>
function showNotification(message,type='info',duration=4000){
    const c=document.getElementById('notificationContainer');
    const id='n-'+Date.now();
    const icons={success:'✓',error:'✗',info:'🤖'};
    const n=document.createElement('div');
    n.id=id;n.className=`notification ${type}`;
    n.innerHTML=`<div class="notification-icon">${icons[type]||icons.info}</div>
        <div class="notification-content"><strong>${type.toUpperCase()}</strong><p>${message}</p></div>
        <button class="close-notification" onclick="closeNotification('${id}')">×</button>`;
    c.appendChild(n);
    if(duration>0)setTimeout(()=>closeNotification(id),duration);
}
function closeNotification(id){const n=document.getElementById(id);if(n){n.classList.add('hidden');setTimeout(()=>n.remove(),300);}}

const togglePassword=document.getElementById('togglePassword');
const password=document.getElementById('password');
togglePassword.addEventListener('click',()=>{
    const t=password.getAttribute('type')==='password'?'text':'password';
    password.setAttribute('type',t);
    togglePassword.innerHTML=t==='password'?'<i class="fas fa-eye"></i>':'<i class="fas fa-eye-slash"></i>';
});

const strengthText=document.getElementById('strengthText');
const strengthFill=document.getElementById('strengthFill');
password.addEventListener('input',function(){
    const p=this.value;
    let s=0,c='#ef4444',t='Very Weak';
    if(p.length>=8)s++;
    if(/[A-Z]/.test(p))s++;
    if(/[0-9]/.test(p))s++;
    if(/[^A-Za-z0-9]/.test(p))s++;
    if(s===1){t='Weak';c='#f59e0b';}
    else if(s===2){t='Fair';c='#f59e0b';}
    else if(s===3){t='Good';c='#10b981';}
    else if(s===4){t='Strong';c='#10b981';}
    strengthText.textContent=`Password strength: ${t}`;
    strengthFill.style.width=`${s*25}%`;
    strengthFill.style.backgroundColor=c;
});

function showTerms(){showNotification('Terms of Service: This is a demo application. Use responsibly.','info',5000);}
function showPrivacy(){showNotification('Privacy Policy: All data is stored locally on your machine.','info',5000);}

document.getElementById('signupForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const username=document.getElementById('username').value.trim();
    const password=document.getElementById('password').value;
    const confirmPassword=document.getElementById('confirmPassword').value;

    if(username.length<3){showNotification('Username must be at least 3 characters','error');return;}
    if(password!==confirmPassword){showNotification('Passwords do not match','error');return;}
    if(password.length<6){showNotification('Password must be at least 6 characters','error');return;}
    if(!document.getElementById('terms').checked){showNotification('Please agree to terms','error');return;}

    const submitBtn=document.getElementById('submitBtn');
    const originalText=submitBtn.innerHTML;
    submitBtn.innerHTML='<div class="spinner"></div> Creating Account...';
    submitBtn.disabled=true;

    try{
        const response=await fetch('http://127.0.0.1:8080/api/signup',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username,password})
        });
        const data=await response.json();
        if(data.success){
            showNotification('Account created successfully! Redirecting to chat...','success');
            localStorage.setItem('isLoggedIn','true');
            localStorage.setItem('username',username);
            localStorage.setItem('userId', data.user_id);
            setTimeout(()=>{window.location.href='chat.html'},1500);
        }else{
            showNotification(data.error || 'Signup failed','error');
            submitBtn.innerHTML=originalText;
            submitBtn.disabled=false;
        }
    }catch(err){
        console.error('Signup error:',err);
        showNotification('Connection error. Make sure backend is running','error');
        submitBtn.innerHTML=originalText;
        submitBtn.disabled=false;
    }
});
</script>
</body>
</html>
